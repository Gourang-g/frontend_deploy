name: Frontend Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'src/App.jsx'  
  workflow_dispatch:

jobs:
  # JOB 1: Build assets and upload them as an artifact
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: frontend-build # Optional: pass name to next job

    steps:
      # 1. Download repository code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Cache npm dependencies using a custom key
      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: /node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 4. Check for cache hit or miss, and install      
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache MISS: Installing dependencies from scratch..."
          npm ci

      - name: Print Cache Status
        if: steps.npm-cache.outputs.cache-hit == 'true'
        run: | 
          echo "Cache HIT: Skipping npm install!"  
          
      # Build your production assets (e.g., outputs to a 'dist' or 'build' folder)
      - name: Build Application
        run: npm run build
        
      # STRATEGY APPLIED: Upload the built static files
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/ # Change to 'build/' if using Create React App
          retention-days: 5

          
      # 5. Login to Docker Hub
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build and push frontend image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/downlload-artifact@v4
        with:
          name: frontend-build
          path: ./download-assests
  
      # 7. Connect to EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            docker stop frontend || true
            docker rm frontend || true
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 3000:80 \
              ${{ secrets.DOCKER_USERNAME }}/frontend:latest
